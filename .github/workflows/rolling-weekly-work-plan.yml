name: Rolling weekly work plan

on:
  schedule:
    # Every Monday at 00:15 in Sri Lanka.
    - cron: "15 0 * * 1"
      timezone: "Asia/Colombo"

  workflow_dispatch:
    inputs:
      week:
        description: "Optional project-week override. Leave blank for automatic."
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: rolling-weekly-work-plan
  cancel-in-progress: false

jobs:
  update-work-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make current and next week available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OVERRIDE_WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail

          args=(
            --repo "$GH_REPO"
            --execute
          )

          if [[ -n "${OVERRIDE_WEEK:-}" ]]; then
            args+=(--week "$OVERRIDE_WEEK")
          fi

          python3 scripts/manage_weekly_work_plan.py "${args[@]}"
