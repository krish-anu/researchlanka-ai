<script>

const paths={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',book:'M4 3h12l4 4v14H4z M15 3v5h5 M8 12h8 M8 16h6',building:'M3 21h18 M5 21V8h14v13 M3 8l9-5 9 5 M8 11v2 M12 11v2 M16 11v2 M8 16v2 M12 16v5 M16 16v2',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M16 4a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-3.9 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',layers:'M12 3l10 5-10 5L2 8z M2 12l10 5 10-5 M2 16l10 5 10-5',network:'M7 7l10 10 M17 7L7 17 M9 5h6 M5 9v6 M19 9v6 M9 19h6 M8 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0 M22 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0 M8 19a3 3 0 1 1-6 0 3 3 0 0 1 6 0 M22 19a3 3 0 1 1-6 0 3 3 0 0 1 6 0',shield:'M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6',search:'M20 20l-5-5 M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',arrow:'M5 12h14 M14 7l5 5-5 5',download:'M12 3v12 M7 10l5 5 5-5 M4 16v5h16v-5',calendar:'M5 5h14v16H5z M8 3v4 M16 3v4 M5 10h14',filter:'M4 6h16 M7 12h10 M10 18h4',table:'M3 4h18v16H3z M3 10h18 M10 4v16',info:'M12 11v6 M12 7h.01 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',leaf:'M20 3c-9 0-17 3-17 10a7 7 0 0 0 14 0z M5 20L16 8',open:'M7 10V7a5 5 0 0 1 9-3 M4 10h16v11H4z M12 14v3',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2 M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2',menu:'M3 6h18 M3 12h18 M3 18h18',close:'M6 6l12 12 M6 18L18 6',check:'M5 12l4 4L19 6',chevron:'M9 5l7 7-7 7'};
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.grid}"/></svg>`}
function hydrate(){document.querySelectorAll('[data-icon]').forEach(e=>{e.innerHTML=icon(e.dataset.icon);e.removeAttribute('data-icon')})}
const pages=[['overview','Overview','grid'],['publications','AI publications','book'],['institutions','Institutions','building'],['researchers','Researchers','users'],['topics','AI topics','layers'],['collaboration','Collaboration','network'],['quality','Data quality','shield']];
document.getElementById('nav').innerHTML=pages.map(([id,label,ic])=>`<a href="#${id}" data-page="${id}">${icon(ic)}${label}${id==='overview'?'<span class="small-dot"></span>':''}</a>`).join('');
const institutions=['University of Peradeniya','University of Colombo','University of Moratuwa','University of Sri Jayewardenepura','University of Kelaniya','University of Ruhuna','University of Jaffna','Eastern University'];
const shortNames=['Peradeniya','Colombo','Moratuwa','Sri Jayewardenepura','Kelaniya','Ruhuna','Jaffna','Eastern'];
const fields=['Machine learning','Computer vision','Language AI','Robotics','Expert systems','Responsible AI'];
const colors=['#347d59','#8fb784','#6489ba','#d5b36c','#9b8bb7','#c8d1bf'];
const sources=['OpenAlex','Crossref','SLJOL','Repositories'];
let seed=47;function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
function weighted(weights){let n=random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<weights.length;i++){n-=weights[i];if(n<0)return i}return weights.length-1}
const yearly=[42,58,86,124,177,243,342,491,687,932];
const subjectTitles=[['Machine learning for crop yield prediction','Machine learning for clinical risk assessment','Deep learning for energy demand forecasting'],['Computer vision for plant disease detection','Deep learning for medical image analysis','AI-based road scene understanding'],['Natural language processing for Sinhala text','Neural machine translation for Tamil and Sinhala','Machine learning for speech recognition'],['Reinforcement learning for autonomous navigation','AI-based robotic grasp planning','Machine learning for human–robot collaboration'],['Knowledge-based AI for clinical decision support','Fuzzy inference for agricultural decision support','Rule-based artificial intelligence for fault diagnosis'],['Explainable AI for healthcare decisions','Fairness in machine learning systems','Privacy-preserving machine learning']];
const records=[];yearly.forEach((count,index)=>{for(let i=0;i<count;i++){const field=weighted([29,23,19+index,14,10,7]),inst=weighted([23,22,18,13,9,7,5,3]),source=weighted([43,29,13,15]);records.push({id:records.length+1,aiRelated:true,year:2016+index,field,inst,partner:random()<.42?(inst+1+Math.floor(random()*7))%8:null,author:inst*30+Math.floor(random()*30),source,oa:random()<(.45+index*.025),doi:random()<[.94,.99,.75,.48][source],abstract:random()<[.88,.79,.86,.63][source],affiliation:random()<[.95,.87,.92,.79][source],title:subjectTitles[field][i%3]+' in Sri Lanka: '+['a comparative study','evidence and emerging directions','a regional perspective','methods and applications'][i%4]})}});
const state={page:'overview',range:'all',field:'all',chart:'area',query:'',pubPage:1,sort:'desc',tables:new Set(),focus:null};
const fmt=n=>n.toLocaleString('en-US');const pct=(n,d)=>d?Math.round(n/d*100):0;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filtered(){return records.filter(r=>r.aiRelated===true&&(state.range==='all'||r.year>=+state.range)&&(state.field==='all'||r.field===+state.field))}
function groups(data,key,labels){return labels.map((label,i)=>({label,i,count:data.filter(r=>r[key]===i).length}))}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((v,i)=>`<td class="${i===0?'name-cell':'numeric'}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function chartControls(id){return `<button class="icon-button table-toggle" data-table="${id}" aria-label="${state.tables.has(id)?'Show chart':'Show data table'}" aria-pressed="${state.tables.has(id)}">${icon('table')}</button>`}
function panel(title,sub,body,actions='',caption=''){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2><p class="panel-sub">${sub}</p></div><div class="panel-actions">${actions}</div></div>${body}${caption?`<div class="chart-caption">${icon('info')}${caption}</div>`:''}</section>`}
function stat(label,value,caption,ic,series){return `<div class="stat"><div class="stat-top">${label}<span class="stat-icon">${icon(ic)}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${caption}</div>${series?`<svg class="spark" viewBox="0 0 80 30" aria-hidden="true"><path d="M0 26 L9 24 L17 26 L26 18 L35 20 L44 13 L53 16 L62 7 L71 10 L80 2" fill="none" stroke="#82ab68" stroke-width="1.7"/></svg>`:''}</div>`}
function stats(data){return `<section class="stats" aria-label="Dataset summary">${stat('AI publications',fmt(data.length),'AI-related records in this period','book',true)}${stat('Institutions',new Set(data.map(r=>r.inst)).size,'With AI-related publications','building',false)}${stat('Open access',pct(data.filter(r=>r.oa).length,data.length)+'%','Share of selected AI publications','open',false)}${stat('DOI coverage',pct(data.filter(r=>r.doi).length,data.length)+'%','Records with a persistent identifier','link',false)}</section>`}
function trend(data){const years=Array.from({length:state.range==='all'?10:2026-+state.range},(_,i)=>(state.range==='all'?2016:+state.range)+i);const vals=years.map(y=>data.filter(r=>r.year===y).length);const oa=years.map(y=>data.filter(r=>r.year===y&&r.oa).length);const max=Math.max(500,Math.ceil(Math.max(...vals)/1000)*1000);const w=620,h=205,left=42,right=598,top=20,bottom=169;const x=i=>left+i*(right-left)/(years.length-1),y=v=>bottom-v/max*(bottom-top);let chart='';
for(let i=0;i<5;i++){const v=max*i/4;chart+=`<line class="gridline" x1="${left}" y1="${y(v)}" x2="${right}" y2="${y(v)}"/><text x="30" y="${y(v)+3}" text-anchor="end">${v>=1000?v/1000+'k':v}</text>`}
if(state.chart==='area'){const line=vals.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ');chart+=`<defs><linearGradient id="area-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#80ac69" stop-opacity=".24"/><stop offset="1" stop-color="#80ac69" stop-opacity=".015"/></linearGradient></defs><path d="${line} L${right},${bottom} L${left},${bottom}Z" fill="url(#area-fill)"/><path d="${line}" stroke="#3e8155" stroke-width="2.5" fill="none" stroke-linejoin="round"/><path d="${oa.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ')}" stroke="#a8bf80" stroke-width="2" stroke-dasharray="5 5" fill="none"/>`}
years.forEach((year,i)=>{if(state.chart==='bar')chart+=`<rect x="${x(i)-12}" y="${y(vals[i])}" width="24" height="${bottom-y(vals[i])}" rx="3" fill="#39805a"/><rect x="${x(i)-12}" y="${y(oa[i])}" width="24" height="${bottom-y(oa[i])}" rx="3" fill="#b9ce92"/>`;chart+=`<g tabindex="0" data-tip="${year}: ${fmt(vals[i])} publications · ${fmt(oa[i])} open access"><circle cx="${x(i)}" cy="${y(vals[i])}" r="4" fill="#fff" stroke="#3e8155" stroke-width="2"/><circle cx="${x(i)}" cy="${y(vals[i])}" r="14" fill="transparent"/></g><text x="${x(i)}" y="192" text-anchor="middle">${year}</text>`});
const growth=vals.length>1?Math.round((vals.at(-1)/vals.at(-2)-1)*100):0;
const body=state.tables.has('trend')?table(['Year','Publications','Open access'],years.map((v,i)=>[v,fmt(vals[i]),fmt(oa[i])])):`<div class="chart-summary"><strong>${fmt(vals.at(-1))}</strong><span class="growth">↗ ${growth}%</span><span class="hint">in ${years.at(-1)} · vs. previous year</span></div><div class="chart-body"><svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Annual publication counts and open access counts; use the table button for exact values">${chart}</svg><div class="legend" style="padding-left:22px"><span><i class="dot" style="background:#3e8155"></i>AI publications</span><span><i class="dot" style="background:#b9ce92"></i>Open access</span></div></div>`;
return panel('AI research output over time','Annual AI-related publications · '+years[0]+'–2025',body,`<div class="segment" aria-label="Chart style"><button data-chart="area" class="${state.chart==='area'?'selected':''}" aria-pressed="${state.chart==='area'}">Area</button><button data-chart="bar" class="${state.chart==='bar'?'selected':''}" aria-pressed="${state.chart==='bar'}">Bar</button></div>${chartControls('trend')}`,'Hover or focus on a data point to explore a year.');}
function donut(data){const parts=groups(data,'field',fields);let offset=0;const rings=parts.map((p,i)=>{const ratio=p.count/data.length*100;const s=`<circle cx="90" cy="90" r="67" fill="none" stroke="${colors[i]}" stroke-width="20" pathLength="100" stroke-dasharray="${Math.max(0,ratio-.9)} ${100-Math.max(0,ratio-.9)}" stroke-dashoffset="${-offset}" transform="rotate(-90 90 90)" data-tip="${p.label}: ${fmt(p.count)} publications" tabindex="0"/>`;offset+=ratio;return s}).join('');return panel('The AI research landscape','Share of AI publications by primary topic',state.tables.has('fields')?table(['AI topic','AI publications','Share'],parts.map(p=>[p.label,fmt(p.count),pct(p.count,data.length)+'%'])):`<div class="donut-wrap"><svg class="donut" viewBox="0 0 180 180" role="img" aria-label="AI topic distribution">${rings}<text x="90" y="86" text-anchor="middle" font-size="26" font-weight="600">${parts.filter(p=>p.count).length}</text><text x="90" y="106" text-anchor="middle" font-size="10" style="fill:#87917e">AI topics</text></svg><div class="donut-list">${parts.map((p,i)=>`<div class="legend-row"><i class="dot" style="background:${colors[i]}"></i><span>${p.label}</span><strong>${pct(p.count,data.length)}%</strong></div>`).join('')}</div></div>`,chartControls('fields'),'Each sample AI publication has one primary AI topic.');}
function ranking(data,full=false){const items=groups(data,'inst',institutions).sort((a,b)=>state.sort==='asc'?a.count-b.count:b.count-a.count).slice(0,full?8:5),max=Math.max(...items.map(i=>i.count));return panel('Institutions advancing AI research',full?'All institutions · ranked by AI publication count':'Top 5 institutions · AI publication count',state.tables.has('ranking')?table(['Institution','Publications'],items.map(p=>[p.label,fmt(p.count)])):`<div class="bar-list">${items.map((p,i)=>`<div><div class="bar-label"><span>${p.label}</span><strong>${fmt(p.count)}</strong></div><div class="track" role="img" aria-label="${p.label}: ${fmt(p.count)} publications"><span style="width:${p.count/max*100}%;background:${['#347d59','#5d956d','#86ac7b','#aac494','#c7d6b6'][Math.min(i,4)]}"></span></div></div>`).join('')}</div>`,`${full?`<button class="text-link" data-sort>${state.sort==='desc'?'Highest first':'Lowest first'} ↕</button>`:`<button class="text-link" data-go="institutions">View all ${icon('arrow')}</button>`}${chartControls('ranking')}`,'Counts use the primary affiliation of AI-related sample publications.');}
function heatmap(data){const years=[2021,2022,2023,2024,2025],parts=fields,matrix=parts.map((_,fi)=>years.map(y=>data.filter(r=>r.year===y&&r.field===fi).length)),max=Math.max(...matrix.flat(),1);const body=state.tables.has('heat')?table(['AI topic',...years],parts.map((p,i)=>[p,...matrix[i]])):`<div class="heatmap"><div class="heat-row"><span></span>${years.map(y=>`<div class="heat-head">${y}</div>`).join('')}</div>${parts.map((p,i)=>`<div class="heat-row"><span>${p}</span>${matrix[i].map((v,j)=>`<div class="heat-cell" tabindex="0" data-tip="${p}, ${years[j]}: ${fmt(v)} publications" style="background:${v?'hsl(105 23% '+(94-v/max*61)+'%)':'#f3f5ef'};color:${v/max>.56?'white':'#5a7050'}">${state.range!=='all'&&years[j]<+state.range?'—':v}</div>`).join('')}</div>`).join('')}<div class="heat-key">Fewer <i style="background:#eef2e9"></i><i style="background:#dce6d3"></i><i style="background:#a8bf95"></i><i style="background:#729661"></i><i style="background:#466839"></i> More publications</div></div>`;return panel('Where AI research is growing','AI publication activity by topic · last five years',body,chartControls('heat'),'Cell labels show exact counts. Darker shades indicate more publications.');}
function pairs(data){const map=new Map();data.filter(r=>r.partner!==null).forEach(r=>{const key=[r.inst,r.partner].sort((a,b)=>a-b).join('-');map.set(key,(map.get(key)||0)+1)});return [...map].map(([key,count])=>({ids:key.split('-').map(Number),count})).sort((a,b)=>b.count-a.count)}
function network(data){const nodes=[[240,124],[378,90],[345,213],[158,208],[107,92],[451,177],[265,32],[66,195]],links=pairs(data),counts=groups(data,'inst',institutions);const focus=state.focus;const drawn=focus===null?links.slice(0,17):links.filter(l=>l.ids.includes(focus));let svg=drawn.map(l=>{const [a,b]=l.ids;return `<line x1="${nodes[a][0]}" y1="${nodes[a][1]}" x2="${nodes[b][0]}" y2="${nodes[b][1]}" stroke="#acc5a5" stroke-opacity=".55" stroke-width="${1+l.count/(links[0]?.count||1)*3}"/>`}).join('');svg+=nodes.map(([x,y],i)=>`<g class="net-node" tabindex="0" role="button" data-node="${i}" aria-label="Explore ${institutions[i]} collaborations" aria-pressed="${focus===i}"><circle cx="${x}" cy="${y}" r="${10+counts[i].count/Math.max(...counts.map(c=>c.count),1)*14}" fill="${colors[i%6]}" stroke="${focus===i?'#193f2a':'white'}" stroke-width="${focus===i?3:4}"/><text x="${x}" y="${y+37}" text-anchor="middle" fill="#728468" font-size="9">${shortNames[i]}</text></g>`).join('');const focusCount=focus===null?links.reduce((sum,l)=>sum+l.count,0):links.filter(l=>l.ids.includes(focus)).reduce((sum,l)=>sum+l.count,0);const summary=`<aside class="network-info"><div class="eyebrow">${focus===null?'BETTER, TOGETHER':'SELECTED INSTITUTION'}</div><h3>${focus===null?'Knowledge has connections.':shortNames[focus]}</h3><p>${focus===null?'Discover the partnerships connecting Sri Lanka’s AI research community. Select a node to explore.':'Showing this institution’s connections. Select another node or reset the view.'}</p><div class="network-metric"><span>Institutions</span><b>${focus===null?8:new Set(drawn.flatMap(l=>l.ids)).size}</b></div><div class="network-metric"><span>Shared publications</span><b>${fmt(focusCount)}</b></div></aside>`;return panel('AI research is a shared endeavour','AI co-publications · node size represents AI publication output',state.tables.has('network')?table(['Institution','Collaborator','Shared publications'],drawn.map(l=>[shortNames[l.ids[0]],shortNames[l.ids[1]],fmt(l.count)])):`<div class="network-wrap"><svg class="network-chart" viewBox="0 0 520 280" role="group" aria-label="Interactive institution collaboration network">${svg}</svg>${summary}</div>`,`<button class="text-link" data-reset-network>Reset view</button>${chartControls('network')}`,'Line thickness indicates shared AI publications. Overview displays the 17 strongest connections.');}
function scatter(data){const counts=groups(data,'inst',institutions);let s='';for(let i=0;i<=4;i++){const y=190-i*37.5;s+=`<line class="gridline" x1="45" y1="${y}" x2="540" y2="${y}"/><text x="32" y="${y+3}" text-anchor="end">${i*25}%</text>`}const max=Math.ceil(Math.max(...counts.map(c=>c.count))/1000)*1000;for(let i=0;i<=4;i++)s+=`<text x="${45+i*123.75}" y="209" text-anchor="middle">${fmt(max*i/4)}</text>`;counts.forEach((c,i)=>{const share=pct(data.filter(r=>r.inst===i&&r.oa).length,c.count),x=45+c.count/max*495,y=190-share*1.5;s+=`<circle cx="${x}" cy="${y}" r="${7+Math.sqrt(c.count)*.16}" fill="${colors[i%6]}" fill-opacity=".8" stroke="white" stroke-width="2" tabindex="0" data-tip="${c.label}: ${fmt(c.count)} publications · ${share}% open access"/><text x="${x}" y="${y-19}" text-anchor="middle" style="font-size:8px">${shortNames[i]}</text>`});s+='<text x="295" y="234" text-anchor="middle">Publication count →</text><text x="12" y="113" transform="rotate(-90 12 113)" text-anchor="middle">Open access share</text>';return panel('Output & accessibility','Compare AI publication volume with open access share',state.tables.has('scatter')?table(['Institution','Publications','Open access'],counts.map(c=>[c.label,fmt(c.count),pct(data.filter(r=>r.inst===c.i&&r.oa).length,c.count)+'%'])):`<div class="chart-body"><svg class="chart" viewBox="0 0 565 248" role="img" aria-label="Scatter plot comparing publication count and open access share by institution">${s}</svg></div>`,chartControls('scatter'),'Hover or focus on an institution for its exact values.');}
function treemap(data){const parts=groups(data,'field',fields).filter(p=>p.count);const total=data.length;let cumulative=0;const rects=parts.map((p,i)=>{const width=p.count/total*600,x=cumulative;cumulative+=width;return `<g tabindex="0" data-tip="${p.label}: ${fmt(p.count)} publications (${pct(p.count,total)}%)"><rect x="${x}" y="15" width="${Math.max(width-4,1)}" height="200" rx="5" fill="${colors[p.i]}"/><text transform="translate(${x+width/2},115) rotate(-90)" text-anchor="middle" style="fill:${p.i===5?'#47563e':'white'};font-size:12px">${p.label} · ${pct(p.count,total)}%</text></g>`}).join('');return panel('The shape of AI research','Proportional topic mosaic · tile area represents AI publication share',state.tables.has('mosaic')?table(['AI topic','AI publications'],parts.map(p=>[p.label,fmt(p.count)])):`<div class="chart-body"><svg class="chart" viewBox="0 0 600 230" role="img" aria-label="Proportional mosaic of AI topics">${rects}</svg></div>`,chartControls('mosaic'),'All tiles use the same height, making their widths easy to compare.');}
function qualityChart(data){const keys=['doi','abstract','affiliation'],labels=['DOI','Abstract','Affiliation'];const rows=sources.map((source,i)=>{const subset=data.filter(r=>r.source===i);return [source,...keys.map(k=>pct(subset.filter(r=>r[k]).length,subset.length)+'%')]});return panel('Metadata completeness by source','Share of AI-related source records containing each metadata field',state.tables.has('quality')?table(['Source',...labels],rows):`<div class="bar-list">${sources.map((source,i)=>`<div><div class="bar-label"><strong>${source}</strong></div>${keys.map((k,j)=>`<div style="display:grid;grid-template-columns:57px 1fr 33px;gap:8px;align-items:center;margin:7px 0;font-size:9px;color:#86907a"><span>${labels[j]}</span><div class="track"><span style="width:${rows[i][j+1]};background:${colors[j]}"></span></div><span>${rows[i][j+1]}</span></div>`).join('')}</div>`).join('')}</div>`,chartControls('quality'),'Every percentage uses AI-related records from that source as its denominator.');}
function sourceChart(data){const items=groups(data,'source',sources);return panel('Where the records come from','Sources of AI-related publications in the sample',`<div class="bar-list">${items.map((p,i)=>`<div><div class="bar-label"><span>${p.label}</span><strong>${fmt(p.count)} · ${pct(p.count,data.length)}%</strong></div><div class="track"><span style="width:${pct(p.count,data.length)}%;background:${colors[i]}"></span></div></div>`).join('')}</div>`,'','Each sample record belongs to a single source.');}
function publicationTable(data,compact=false){let rows=data.filter(r=>!state.query||[r.title,fields[r.field],institutions[r.inst]].join(' ').toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>b.year-a.year||b.id-a.id);const size=compact?4:8,total=rows.length,max=Math.max(1,Math.ceil(total/size));state.pubPage=Math.min(state.pubPage,max);const start=compact?0:(state.pubPage-1)*size;const content=rows.slice(start,start+size);return `<section class="panel">${compact?`<div class="panel-head"><div><h2>A closer look at AI research</h2><p class="panel-sub">Latest sample AI publications in the selected period</p></div><button class="text-link" data-go="publications">Browse AI publications ${icon('arrow')}</button></div>`:`<div class="toolbar"><input id="publication-query" value="${esc(state.query)}" placeholder="Search AI title, topic, or institution…" aria-label="Filter sample AI publications"><p><strong>${fmt(total)}</strong> matching AI publications</p></div>`}<div class="table-wrap"><table><thead><tr><th scope="col">Publication</th><th scope="col">AI topic</th><th scope="col">Year</th><th scope="col">Access</th></tr></thead><tbody>${content.map(r=>`<tr><td class="name-cell"><button data-record="${r.id}" style="padding:0;text-align:left;font-size:11px;max-width:480px">${r.title}</button><small>${institutions[r.inst]} · Sample record #${r.id}</small></td><td><span class="pill blue">${fields[r.field]}</span></td><td>${r.year}</td><td><span class="pill ${r.oa?'':'gold'}">${r.oa?'Open access':'Restricted'}</span></td></tr>`).join('')}</tbody></table>${!total?'<div class="empty">No publications match your search. Try a broader title or clear the search.</div>':''}</div>${!compact?`<div class="pagination"><span>${total?fmt(start+1):0}–${fmt(Math.min(start+size,total))} of ${fmt(total)}</span><div><button class="button" data-pagination="-1" ${state.pubPage===1?'disabled':''}>Previous</button><button class="button" data-pagination="1" ${state.pubPage>=max?'disabled':''}>Next ${icon('chevron')}</button></div></div>`:''}</section>`}
function researcherCards(data){const people=Array.from({length:240},(_,i)=>({id:i,items:data.filter(r=>r.author===i)})).filter(p=>p.items.length).sort((a,b)=>b.items.length-a.items.length).slice(0,9);return `<div class="preview-note">${icon('info')}Researcher identities are fictional in this preview. Production profiles must retain author-disambiguation notes.</div><div class="researcher-grid">${people.map(p=>`<article class="panel person"><div class="avatar">R${String(p.id+1).padStart(3,'0')}</div><h3>Sample researcher ${String(p.id+1).padStart(3,'0')}</h3><p>${institutions[Math.floor(p.id/30)]}</p><span class="pill">${fields[groups(p.items,'field',fields).sort((a,b)=>b.count-a.count)[0].i]}</span><div class="person-numbers"><div><strong>${p.items.length}</strong><span>Publications</span></div><div><strong>${pct(p.items.filter(r=>r.oa).length,p.items.length)}%</strong><span>Open access</span></div></div><button class="text-link" data-person="${p.id}" style="margin-top:17px">Explore researcher ${icon('arrow')}</button></article>`).join('')}</div>`}
const titles={overview:['Sri Lanka’s AI research, in focus.','Explore the people, ideas, and connections shaping artificial intelligence research.'],publications:['Discover AI research.','Find AI-related publications, explore AI topics, and follow new ideas.'],institutions:['Places where ideas grow.','Compare AI publication output, accessibility, and research partnerships.'],researchers:['People behind the progress.','Discover researchers through their AI-related publications and collaborations.'],topics:['Follow the AI ideas.','See how AI topics evolve and where research activity is growing.'],collaboration:['Connected by discovery.','Explore institutional partnerships through their shared AI-related publications.'],quality:['Confidence starts with context.','Understand source coverage and metadata completeness within the AI publication collection.']};
function render(){const data=filtered();const [title,desc]=titles[state.page];document.title=`ResearchLanka · ${pages.find(p=>p[0]===state.page)[1]} · Preview`;document.getElementById('breadcrumb').textContent=pages.find(p=>p[0]===state.page)[1];document.querySelectorAll('[data-page]').forEach(a=>{const active=a.dataset.page===state.page;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
let html=`<div class="intro"><div><div class="eyebrow">SRI LANKA · AI RESEARCH INTELLIGENCE</div><h1>${title}</h1><p>${desc}</p></div><button class="button" data-export>${icon('download')}Export sample data</button></div>`;
if(state.page==='overview')html+=`<section class="hero"><div class="hero-copy"><div class="eyebrow">ARTIFICIAL INTELLIGENCE. SRI LANKAN DISCOVERY.</div><h2>A clearer picture of<br><em>AI research in Sri Lanka.</em></h2><p>Explore AI methods, applications, and collaborations.<br>Every insight begins with an AI-related publication.</p></div><svg class="hero-art" viewBox="0 0 360 270" aria-hidden="true"><g fill="none" stroke="#86aa67" stroke-width=".7" opacity=".45"><ellipse cx="180" cy="137" rx="145" ry="97" transform="rotate(-30 180 137)"/><ellipse cx="180" cy="137" rx="135" ry="66" transform="rotate(40 180 137)"/><ellipse cx="180" cy="137" rx="110" ry="104"/><ellipse cx="180" cy="137" rx="65" ry="120" transform="rotate(30 180 137)"/><path d="M58 183L117 63 230 54 303 132 259 216 145 217 58 183 230 54 259 216 117 63 145 217 303 132 117 63 M58 183l245-51 M145 217L230 54"/></g><g fill="#d5ed9b"><circle cx="117" cy="63" r="5"/><circle cx="230" cy="54" r="4"/><circle cx="303" cy="132" r="6"/><circle cx="259" cy="216" r="4"/><circle cx="145" cy="217" r="5"/><circle cx="58" cy="183" r="4"/><circle cx="183" cy="137" r="8"/></g><circle cx="183" cy="137" r="19" fill="none" stroke="#afcc89" stroke-opacity=".4"/></svg><span class="hero-label">Local knowledge. Global perspective.</span></section>`;
html+=`<div class="filters"><div class="filter-group">${icon('filter')}<label class="select-wrap">${icon('calendar')}<select id="year-filter" aria-label="Publication year range"><option value="all" ${state.range==='all'?'selected':''}>2016 – 2025</option><option value="2021" ${state.range==='2021'?'selected':''}>2021 – 2025</option><option value="2023" ${state.range==='2023'?'selected':''}>2023 – 2025</option></select></label><label class="select-wrap">${icon('layers')}<select id="field-filter" aria-label="AI research topic"><option value="all">All AI topics</option>${fields.map((f,i)=>`<option value="${i}" ${state.field===String(i)?'selected':''}>${f}</option>`).join('')}</select></label>${state.range!=='all'||state.field!=='all'?'<button class="reset" data-reset-filters>Reset filters</button>':''}</div><span class="filter-caption"><span class="status-dot"></span>AI sample dataset · 2016–2025</span></div>`;
html+=`<div class="preview-note">${icon('check')}<span><strong>AI-related publications only.</strong> All charts, rankings, profiles, and exports use this collection. Preview figures are illustrative.</span></div>`;
if(state.page!=='researchers')html+=stats(data);
switch(state.page){case 'overview':html+=`<div class="grid">${trend(data)}${donut(data)}</div><div class="grid equal">${ranking(data)}${heatmap(data)}</div>${network(data)}<div style="height:20px"></div>${publicationTable(data,true)}`;break;
case 'publications':html+=publicationTable(data);break;
case 'institutions':html+=`<div class="grid equal">${ranking(data,true)}${scatter(data)}</div>${panel('Institution directory','Primary affiliations in the selected AI publication sample',table(['Institution','AI publications','Open access','AI topics'],groups(data,'inst',institutions).sort((a,b)=>b.count-a.count).map((p,i)=>[`<span class="rank">${String(i+1).padStart(2,'0')}</span>${p.label}`,fmt(p.count),pct(data.filter(r=>r.inst===p.i&&r.oa).length,p.count)+'%',new Set(data.filter(r=>r.inst===p.i).map(r=>r.field)).size])))}<div style="height:20px"></div>${network(data)}`;break;
case 'researchers':html+=researcherCards(data);break;
case 'topics':html+=`<div class="grid equal">${treemap(data)}${donut(data)}</div><div class="grid equal">${heatmap(data)}${trend(data)}</div>`;break;
case 'collaboration':html+=network(data)+`<div class="section-heading"><div><h2>Partnerships at a glance</h2><p>The most active institution pairs in the selected sample.</p></div></div>`+panel('Stronger connections, shared discoveries','Pairs ranked by shared publication count',table(['Institution','Collaborator','Shared publications'],pairs(data).slice(0,10).map(l=>[institutions[l.ids[0]],institutions[l.ids[1]],fmt(l.count)])));break;
case 'quality':html+=`<div class="grid equal">${qualityChart(data)}${sourceChart(data)}</div><div class="grid equal"><section class="panel quality-note"><h3>Coverage is a lens, not the whole picture.</h3><p>All views are scoped to AI-related publications. Institution rankings, researcher profiles, collaboration links, and metadata percentages describe that AI collection only. Coverage can vary by source and year.</p><p>This HTML preview uses generated AI-related sample records. Its counts, affiliations, connections, and metadata scores do not describe actual institutions or research output.</p></section><section class="panel quality-note"><h3>Keep the context close to the numbers.</h3><p>The production design should show snapshot dates, denominators, missing metadata, source conflicts, and author-disambiguation limitations alongside relevant views.</p><p>Here, filters, chart tables, and CSV downloads all use the same illustrative records so you can evaluate the interactions.</p></section></div>`;break;}
html+=`<footer class="foot"><span>${icon('leaf')}ResearchLanka · Knowledge, connected.</span><span>AI-only UI concept · Illustrative sample data · Works offline</span></footer>`;document.getElementById('main').innerHTML=html;hydrate();hideTooltip();}
function navigate(page){if(!pages.some(p=>p[0]===page))page='overview';state.page=page;state.pubPage=1;state.focus=null;closeMenu();render();window.scrollTo(0,0)}
function go(page){if(location.hash==='#'+page)navigate(page);else location.hash=page}
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),3500)}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')}
function modal(title,body){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=body;document.getElementById('dialog').showModal()}
function exportData(){let data=filtered();if(state.page==='publications'&&state.query)data=data.filter(r=>[r.title,fields[r.field],institutions[r.inst]].join(' ').toLowerCase().includes(state.query.toLowerCase()));const rows=[['sample_id','title','year','ai_topic','institution','source','open_access','has_doi','ai_related','data_status'],...data.map(r=>[r.id,r.title,r.year,fields[r.field],institutions[r.inst],sources[r.source],r.oa,r.doi,r.aiRelated,'ILLUSTRATIVE AI SAMPLE'])];const csv=rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='researchlanka-ai-sample-'+state.page+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify(`Exported ${fmt(data.length)} illustrative AI sample records.`)}
document.addEventListener('change',e=>{if(e.target.id==='year-filter'){state.range=e.target.value;state.pubPage=1;render();document.getElementById('year-filter').focus()}if(e.target.id==='field-filter'){state.field=e.target.value;state.pubPage=1;render();document.getElementById('field-filter').focus()}});
document.addEventListener('input',e=>{if(e.target.id==='publication-query'){state.query=e.target.value;state.pubPage=1;const pos=e.target.selectionStart;render();const input=document.getElementById('publication-query');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-node]');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.chart){state.chart=b.dataset.chart;state.tables.delete('trend');render();document.querySelector(`[data-chart="${state.chart}"]`).focus()}if(b.dataset.table){const id=b.dataset.table;state.tables.has(id)?state.tables.delete(id):state.tables.add(id);render();document.querySelector(`[data-table="${id}"]`).focus()}if(b.hasAttribute('data-sort')){state.sort=state.sort==='desc'?'asc':'desc';render();document.querySelector('[data-sort]').focus()}if(b.hasAttribute('data-export'))exportData();if(b.dataset.node!==undefined){state.focus=+b.dataset.node;render();document.querySelector(`[data-node="${state.focus}"]`)?.focus()}if(b.hasAttribute('data-reset-network')){state.focus=null;render();document.querySelector('[data-reset-network]').focus()}if(b.hasAttribute('data-reset-filters')){state.range='all';state.field='all';render();document.getElementById('year-filter').focus()}if(b.dataset.pagination){state.pubPage+=+b.dataset.pagination;render();document.getElementById('main').focus()}if(b.dataset.record){const r=records.find(r=>r.id===+b.dataset.record);modal(r.title,`<span class="pill">Illustrative sample record #${r.id}</span><p><strong>${institutions[r.inst]}</strong><br>${fields[r.field]} · ${r.year} · ${sources[r.source]}</p><p>This AI-related sample publication illustrates the proposed detail view. A real publication page would include its abstract, author list, identifiers, source provenance, and related research.</p><p>Access: ${r.oa?'Open access':'Restricted'}<br>DOI coverage: ${r.doi?'Identifier present in sample metadata':'Missing in sample metadata'}</p>`)}if(b.dataset.person){const id=+b.dataset.person,items=filtered().filter(r=>r.author===id);modal('Sample researcher '+String(id+1).padStart(3,'0'),`<span class="pill">Fictional researcher profile</span><p>${institutions[Math.floor(id/30)]}</p><p>${fmt(items.length)} sample publications · ${pct(items.filter(r=>r.oa).length,items.length)}% open access</p>${table(['Recent sample title','Year'],items.slice(-4).reverse().map(r=>[r.title,r.year]))}`)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-node]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.key==='Escape'){closeMenu();hideTooltip()}});
document.getElementById('menu').addEventListener('click',()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});document.getElementById('overlay').addEventListener('click',closeMenu);
document.getElementById('global-search').addEventListener('submit',e=>{e.preventDefault();state.query=document.getElementById('global-query').value.trim();go('publications')});
document.getElementById('close-dialog').addEventListener('click',()=>document.getElementById('dialog').close());document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});
function hideTooltip(){document.getElementById('tooltip').style.display='none'}function showTooltip(el,x,y){const tip=document.getElementById('tooltip');tip.textContent=el.dataset.tip;tip.style.display='block';tip.style.left=Math.max(8,Math.min(x+12,innerWidth-tip.offsetWidth-10))+'px';tip.style.top=Math.max(8,Math.min(y+14,innerHeight-tip.offsetHeight-10))+'px'}
document.addEventListener('pointermove',e=>{const el=e.target.closest('[data-tip]');if(el)showTooltip(el,e.clientX,e.clientY);else hideTooltip()});document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTooltip(el,r.left,r.bottom)}});document.addEventListener('focusout',hideTooltip);window.addEventListener('scroll',hideTooltip,{passive:true});
window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));navigate(location.hash.slice(1)||'overview');hydrate();
</script>
</body>
</html>
