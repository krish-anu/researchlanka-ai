[pytest]
pythonpath = .
markers =
    phase1: Phase 1 ETL / data integration suite
    cleaning: Cleaning / normalization tests
    preprocessing: Preprocessing tests
    transforming: Transform / schema mapping tests
    deduplication: Deduplication tests
    disambiguation: Author disambiguation tests
    entity_resolution: Institution entity resolution tests
    e2e_ingestion: End-to-end ingestion pipeline tests
    dagster: Dagster asset/job smoke tests
    database: Database load contract tests
    edge_case: Edge-case / adversarial inputs
    phase2: Phase 2 DB integrity / ML / API suite
    database_integrity: Phase 2 database integrity tests
    classification: Phase 2 classification ML tests
    nmf_topic_modeling: Phase 2 NMF topic modeling tests
    semantic_search: Phase 2 semantic search tests
    api: Phase 2 API endpoint tests
    api_matrix: Phase 2 API matrix cases
    phase3: Phase 3 overall application suite
    frontend: Phase 3 frontend contract / Vitest bridge tests
    integration: Phase 3 integration smoke tests
    performance: Phase 3 performance budget tests
    security: Phase 3 security tests
    load: Phase 3 concurrent load tests
    recovery: Phase 3 recovery / resilience tests
    accessibility: Phase 3 accessibility / error-contract tests
    deploy_config: Phase 3 deploy/compose configuration tests
