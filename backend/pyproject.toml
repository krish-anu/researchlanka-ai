[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-analytics-framework"
version = "0.1.0"
description = "Reusable national research publication collection, integration, cleaning, deduplication, and analytics framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml==0.7.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "joblib==1.6.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv==1.2.3",
    "google-genai>=2.25.0",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.1",
    # Required by research_analytics.duplicate_analysis (fuzzy title matching).
    "rapidfuzz==3.14.6",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.16.1",
    "uvicorn[standard]==0.40.0",
    "xgboost==3.4.1",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest==9.1.1"]
# Semantic topic modelling (scripts/modeling/run_bertopic_topic_modeling.py).
# Kept out of the core deps because it pulls in torch.
topic-modeling = [
    "bertopic==0.17.4",
    "sentence-transformers==6.1.0",
    "umap-learn==0.5.12",
    "hdbscan==0.8.44",
    "gensim==4.4.0",
]

[project.scripts]
research-framework = "research_analytics.cli:main"
run-pipeline = "research_analytics.cli:run_stage_cli"
load-records = "src.database.load_records:main"
research-api = "src.api.server:main"
research-model-api = "src.api.fastapi_app:main"
train-publication-classifier = "src.modeling.training:main"
compare-publication-classifiers = "src.modeling.classification_comparison:main"
predict-publication-classifier = "src.modeling.inference:main"
evaluate-publication-classifier = "src.modeling.evaluation:main"
validate-analysis-dataset = "src.quality.validate_analysis_dataset:main"
validate-ai-release-dataset = "src.quality.validate_ai_release_dataset:main"
create-publication-dataset-splits = "src.modeling.dataset_splits:main"
generate-publication-embeddings = "src.modeling.embeddings:main"
build-ai-candidate-sample = "src.ai_relevance.sampling:main"
run-gemini-ai-relevance = "src.ai_relevance.runner:main"

[tool.setuptools.packages.find]
include = ["research_analytics*", "src*"]
