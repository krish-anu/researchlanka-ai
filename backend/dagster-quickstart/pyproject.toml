[project]
name = "dagster_quickstart"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.16",
    "dagster-pipes==1.13.16",
    "dagster-shared==1.13.16",
    "pandas>=2.3.3",
    "protobuf<6",
]

[dependency-groups]
dev = [
    "dagster-dg-cli==1.13.16",
    "dagster-webserver==1.13.16",
    "google-cloud-bigquery-storage>=2.30,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_quickstart"]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_quickstart"
registry_modules = [
    "dagster_quickstart.components.*",
]
