services:
  db:
    image: postgres:16
    container_name: researchlanka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-researchlanka}
      POSTGRES_USER: ${POSTGRES_USER:-researchlanka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  research-framework:
    build: .
    command: ["run-all", "--config", "configurations/sri_lanka/config.json"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-researchlanka_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-researchlanka}
    volumes:
      - ./outputs:/app/outputs

volumes:
  postgres_data:
